# Stack d'exploitation (S6) : reverse proxy TLS, Prometheus, Grafana.
# Complète compose.yaml et compose.mlflow.yaml : les trois fichiers se lancent toujours ensemble.
# Le plus sûr : déclarer la liste une fois dans .env, lue par toute commande docker compose
# (release.sh compris, qui sinon recréerait l'API avec le port 8000 publié) :
#
#   COMPOSE_FILE=compose.yaml:compose.mlflow.yaml:compose.monitoring.yaml
#   docker compose up -d
#   API     : https://<ip-de-la-vm>/            (443, via le proxy ; le port 8000 n'est plus publié)
#   Grafana : https://<ip-de-la-vm>/grafana/   (via le proxy ; le port 3000 n'est plus publié)
#
# Prérequis : certs/velov.crt et certs/velov.key (scripts/make_cert.sh), GRAFANA_ADMIN_PASSWORD et
# GRAFANA_DB_PASSWORD dans .env.

services:
  api:
    # L'API n'est plus joignable que par le proxy : on retire le port publié par compose.yaml.
    ports: !reset []

  db:
    # Joignable depuis la VM seulement (127.0.0.1), pour velov.monitor ; jamais depuis le réseau.
    ports:
      - "127.0.0.1:5432:5432"

  proxy:
    image: nginx:1.30-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/velov.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - grafana
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.5
    depends_on:
      - alertmanager
      - pushgateway
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant, voir .env.example}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Servi par le proxy sous /grafana/ (S6, Should) : Grafana doit connaître ce préfixe pour ses liens.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Mot de passe de grafana_ro, lu par docker/grafana/provisioning/datasources/postgres.yml.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD manquant, voir .env.example}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Envoie les alertes de Prometheus sur Discord (Stretch S6). Non publié : on lit les alertes dans Prometheus
  # ou Grafana ; amtool s'utilise par docker compose exec.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro      # discord_webhook_url, hors de git
      - alertdata:/alertmanager                      # silences et notifications déjà envoyées
    restart: unless-stopped

  # Résultats des tâches planifiées (dbt build, velov.monitor), poussés par leurs scripts depuis la VM.
  # Publié en local seulement : les scripts tournent sur la VM, rien ne doit y écrire depuis le réseau.
  pushgateway:
    image: prom/pushgateway:v1.11.1
    command:
      - --persistence.file=/data/metrics   # garde le dernier résultat après un redémarrage (sinon MonitorAbsent)
      - --persistence.interval=1m
    volumes:
      - pushdata:/data
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped

  # Crée ou met à jour l'utilisateur grafana_ro (lecture seule sur predictions), puis s'arrête.
  # Après l'API : c'est elle qui crée la table predictions au démarrage.
  grafana-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: velov
      PGDATABASE: velov
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.example}
      RO_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD manquant, voir .env.example}
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -v pw=\"$$RO_PASSWORD\" -f /grafana_ro.sql"]
    volumes:
      - ./docker/postgres/grafana_ro.sql:/grafana_ro.sql:ro
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  promdata:
  grafanadata:
  alertdata:
  pushdata:
