services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copier .env.example vers .env}
      POSTGRES_DB: velov
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # accès local pour l'ingestion et dbt (jamais exposé hors machine)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov -d velov"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: velov-api:${VERSION:-dev}-${GIT_COMMIT:-unknown}
    environment:
      DATABASE_URL: postgresql://velov:${POSTGRES_PASSWORD}@db:5432/velov
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Collecte réelle (open data Métropole de Lyon + Open-Meteo), un relevé par heure, rejouable sans doublon.
  # Démarrage : docker compose --profile collect up -d collector
  collector:
    profiles: ["collect"]
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: velov-api:${VERSION:-dev}-${GIT_COMMIT:-unknown}
    command: ["python", "-m", "velov.ingest", "--source", "grandlyon", "--every", "3600"]
    environment:
      DATABASE_URL: postgresql://velov:${POSTGRES_PASSWORD}@db:5432/velov
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
