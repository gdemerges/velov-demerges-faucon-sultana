# Connexion lue dans l'environnement (mêmes variables que le compose), aucun secret ici.
velov:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'velov') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'velov') }}"
      schema: public
      threads: 4
