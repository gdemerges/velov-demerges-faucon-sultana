# Reverse proxy TLS devant l'API (S6). Monté en /etc/nginx/conf.d/default.conf.
log_format velov '$remote_addr [$time_iso8601] "$request" $status '
                 'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/velov.crt;
    ssl_certificate_key /etc/nginx/certs/velov.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log velov;

    # DNS interne de Docker, relu toutes les 10 s : l'API recréée par release.sh peut changer d'adresse.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    # Les métriques restent dans le réseau du compose : Prometheus les lit sur api:8000.
    location = /metrics { return 404; }

    location / {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }
}
